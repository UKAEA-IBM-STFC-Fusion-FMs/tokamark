local: true

get_shots_settings:
  max_index:      # If empty, all the available shot IDs are used.
  shuffle: false  # If true, shuffling is done before selection of subset of shot IDs.
  seed: 42

store_manager_settings:  # To override default values in `src.MAST_tools.store_utils.MASTStorageManager.__init__`:
  # base_local_data_path: /mast/tokamark/v1
  base_local_data_path: /rds/project/rds-mOlK9qn0PlQ/fairmast/upload-tmp/level2
  # data_format: zarr   # Optional: "zarr" (default) or "netcdf". Selects the format loaded via xarray.

dataloader_settings:
  batch_size: 512
  num_workers: 16

task_name: get_metadata

task_configuration:
  sources_and_signals:
    input_name:
      - [magnetics, flux_loop_flux]
      - [magnetics, b_field_pol_probe_ccbv_field]
