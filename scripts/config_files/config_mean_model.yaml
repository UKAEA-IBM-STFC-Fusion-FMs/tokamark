local: false

get_shots_settings:
  max_index:      # If empty, all available shots are used.
  shuffle: false  # If true, shuffling is done before selection of subset of shot IDs.
  seed: 42

# User-defined settings to override default values in `src.MAST_tools.store_utils.MASTStorageManager.__init__`:
store_manager_settings:
  base_local_data_path: /mast/tokamark/v1  # REMARK: Only relevant when `local` above is true.
  # data_format: zarr   # Optional: "zarr" (default) or "netcdf". Selects the format loaded via xarray.

dataloader_settings:
  batch_size: 20  # 4
  num_workers: 20  # 0

persistence_settings:
  model: mean
  compute_summary_metrics: true
  save_windows_metrics: false
  save_task_metrics: true
  output_dir: ../output/mean
  ar_tasks:
    - task_1-1
    - task_1-2
    - task_1-3
    - task_2-1
    - task_2-2
    - task_2-3
    - task_3-1
    - task_3-2
    - task_3-3
    - task_4-1
    - task_4-2
    - task_4-3
    - task_4-4
    - task_4-5
